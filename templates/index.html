<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miki.ai — Chat with your documents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="app" id="app">
    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="sidebar">
      <button class="new-chat" id="newChat">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>New chat</span>
      </button>

      <div class="sidebar__section">
        <div class="sidebar__label">Recent</div>
        <div class="history" id="history"></div>
      </div>

      <div class="sidebar__section sidebar__docs">
        <div class="sidebar__label">
          <span>Knowledge base</span>
          <button class="mini-btn" id="uploadTrigger" title="Upload document">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="docs" id="docList"></div>
      </div>

      <div class="sidebar__footer">
        <button class="footer-item" id="themeToggle">
          <svg viewBox="0 0 24 24" class="ico-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span>Toggle theme</span>
        </button>
      </div>
    </aside>

    <!-- ===================== MAIN ===================== -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn topbar__menu" id="menuToggleMobile" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="brand">
          <span class="brand__mark">✦</span>
          <span class="brand__name">Miki<span class="brand__dot">.ai</span></span>
        </div>
        <div class="topbar__spacer"></div>
        <div class="pill" id="statusPill">
          <span class="pill__dot"></span>
          <span id="statusText">Ready</span>
        </div>
        <div class="user-menu" id="userMenu" hidden>
          <button class="user-chip" id="userChip" aria-haspopup="true">
            <span class="user-chip__avatar" id="userAvatar">U</span>
            <span class="user-chip__name" id="userName">User</span>
            <svg viewBox="0 0 24 24" class="user-chip__caret"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="user-dropdown" id="userDropdown" hidden>
            <div class="user-dropdown__head">
              <span class="user-chip__avatar" id="userAvatarLg">U</span>
              <div>
                <div class="user-dropdown__name" id="userNameLg">User</div>
                <div class="user-dropdown__email" id="userEmail"></div>
              </div>
            </div>
            <button class="user-dropdown__item" id="logoutBtn">
              <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
              <span>Sign out</span>
            </button>
          </div>
        </div>
      </header>

      <section class="chat" id="chat">
        <!-- Welcome / empty state -->
        <div class="welcome" id="welcome">
          <h1 class="welcome__hello">Hello there</h1>
          <p class="welcome__sub">Ask me anything, or upload a document and chat with it.</p>
          <div class="suggestions" id="suggestions">
            <button class="suggestion" data-prompt="Summarise the key points of my uploaded document.">
              <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
              <span>Summarise my document</span>
            </button>
            <button class="suggestion" data-prompt="What are the main risks or open questions mentioned?">
              <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
              <span>Find risks & open questions</span>
            </button>
            <button class="suggestion" data-prompt="Explain retrieval-augmented generation (RAG) simply.">
              <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.7V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.3A7 7 0 0 0 12 2zM9 22h6"/></svg>
              <span>Explain RAG simply</span>
            </button>
            <button class="suggestion" data-prompt="Draft a professional email summarising today's decisions.">
              <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z M22 6l-10 7L2 6"/></svg>
              <span>Draft a professional email</span>
            </button>
          </div>
        </div>

        <div class="messages" id="messages"></div>
      </section>

      <!-- Composer -->
      <footer class="composer-wrap">
        <div class="drop-hint" id="dropHint">Drop your file to add it to the knowledge base</div>
        <div class="composer" id="composer">
          <button class="icon-btn composer__attach" id="attachBtn" title="Attach document">
            <svg viewBox="0 0 24 24"><path d="M21.4 11.05 12.25 20.2a5 5 0 0 1-7.07-7.07l9.19-9.19a3 3 0 0 1 4.24 4.24l-9.2 9.19a1 1 0 0 1-1.41-1.41l8.48-8.49"/></svg>
          </button>
          <textarea id="input" class="composer__input" rows="1"
                    placeholder="Ask Miki…" autocomplete="off"></textarea>
          <button class="send-btn" id="sendBtn" title="Send" disabled>
            <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 8 6 8-16-8z"/></svg>
          </button>
        </div>
        <div class="composer__foot">Miki can make mistakes. Verify important information.</div>
      </footer>
    </main>
  </div>

  <input type="file" id="fileInput" accept=".pdf,.txt,.md,.docx" hidden />
  <div class="toast-wrap" id="toastWrap"></div>

  <script>
    window.MIKI_CONFIGURED = {{ 'true' if configured else 'false' }};
    window.AUTH_ENABLED = {{ 'true' if auth_enabled else 'false' }};
    window.MIKI_USER = {{ (user or None) | tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
